apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartbeat-api
  namespace: heartbeat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heartbeat-api
  template:
    metadata:
      labels:
        app: heartbeat-api
    spec:
      containers:
        - name: heartbeat-api
          image: heartbeat-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: IMAGE_TAG
              valueFrom:
                fieldRef:
                  fieldPath: spec.containers[0].image
          readinessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
